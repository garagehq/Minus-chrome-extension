<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    @font-face {
      font-family: "VT323";
      src: url("VT323.ttf") format("truetype");
      font-display: block;
    }
    :root { --blue: #3b82f6; --ink: #cfe6ff; --panel: #0e1621; --line: #24425f; --muted: #6f8bab; }
    * { box-sizing: border-box; }
    body {
      width: 290px; margin: 0; padding: 20px 20px 16px;
      background: #070b10; color: var(--ink);
      font-family: "VT323", ui-monospace, monospace; font-size: 17px;
      position: relative; overflow: hidden;
    }
    body::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px);
      mix-blend-mode: multiply;
    }

    .brand { text-align: center; margin: 2px 0 18px; }
    .brand .word { font-family: "VT323", monospace; font-size: 46px; line-height: 1; color: var(--blue);
      letter-spacing: 0.08em; text-shadow: 0 0 12px rgba(59,130,246,0.55); }

    /* Per-page blocked counter */
    .stat { display: flex; align-items: baseline; justify-content: center; gap: 10px;
      padding: 12px 0 16px; margin-bottom: 6px; border-bottom: 1px solid var(--line); }
    .stat .num { font-family: "VT323", monospace; font-size: 40px; line-height: 1; color: var(--blue);
      text-shadow: 0 0 12px rgba(59,130,246,0.6); }
    .stat .statlabel { font-size: 16px; color: var(--muted); letter-spacing: 0.04em; max-width: 150px; }

    /* Controls: generous vertical rhythm */
    .row { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
    .row .rl { font-size: 18px; letter-spacing: 0.03em; color: var(--ink); cursor: pointer; }
    .toggle-switch input:disabled ~ .rl { color: var(--muted); }

    label.field { display: block; font-size: 16px; margin: 16px 0 5px; letter-spacing: 0.08em;
      text-transform: uppercase; color: #7fb0e6; }
    input[type="text"], select {
      width: 100%; background: var(--panel); border: 1px solid var(--line); color: var(--ink);
      border-radius: 3px; padding: 7px 8px; font-family: "VT323", monospace; font-size: 17px;
    }
    select { cursor: pointer; }
    input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--blue); cursor: pointer; }

    #status { font-size: 16px; margin-top: 16px; min-height: 15px; letter-spacing: 0.03em; color: #6fd39a; }
    #status::before { content: "> "; color: var(--blue); }
    #bar { display: none; height: 6px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 3px; margin-top: 8px; overflow: hidden; }
    #bar > div { height: 100%; width: 0; background: var(--blue); box-shadow: 0 0 8px var(--blue); transition: width .3s; }

    .foot { display: flex; justify-content: space-between; align-items: center;
      margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line);
      font-size: 15px; color: var(--muted); letter-spacing: 0.04em; }
    .foot a { color: var(--muted); text-decoration: none; }
    .foot a:hover { color: var(--blue); }

    /* Square sliding toggle (ported from garagehq/Minus), blue accent + glow. */
    .toggle-switch { position: relative; display: inline-block; width: 46px; height: 22px; flex: 0 0 auto; }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-slider { position: absolute; cursor: pointer; inset: 0;
      background: var(--panel); border: 1px solid var(--line); transition: 0.3s; }
    .toggle-slider::before { position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px;
      background: #5b7fa6; transition: 0.3s; }
    .toggle-switch input:checked + .toggle-slider { background: transparent; border-color: var(--blue); }
    .toggle-switch input:checked + .toggle-slider::before { transform: translateX(26px);
      background: var(--blue); box-shadow: 0 0 10px var(--blue); }
    .toggle-switch input:disabled + .toggle-slider { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <div class="brand"><span class="word">Minus</span></div>

  <div class="stat">
    <span class="num" id="blockedCount">0</span>
    <span class="statlabel">ads blocked on this page</span>
  </div>

  <div class="row">
    <label class="toggle-switch"><input type="checkbox" id="enabled"><span class="toggle-slider"></span></label>
    <label for="enabled" class="rl">Block ads (all sites)</label>
  </div>
  <div class="row">
    <label class="toggle-switch"><input type="checkbox" id="siteEnabled"><span class="toggle-slider"></span></label>
    <label for="siteEnabled" class="rl" id="siteLabel">Block on this site</label>
  </div>

  <label class="field">Ad types</label>
  <div class="row">
    <label class="toggle-switch"><input type="checkbox" id="blockVideo"><span class="toggle-slider"></span></label>
    <label for="blockVideo" class="rl">Video ads (in-player)</label>
  </div>
  <div class="row">
    <label class="toggle-switch"><input type="checkbox" id="blockDisplay"><span class="toggle-slider"></span></label>
    <label for="blockDisplay" class="rl">Display ads (banners / images)</label>
  </div>

  <div class="row">
    <label class="toggle-switch"><input type="checkbox" id="collect"><span class="toggle-slider"></span></label>
    <label for="collect" class="rl">Contribute anonymous ad snapshots</label>
  </div>

  <label class="field" for="threshold">Ad threshold (0–1)</label>
  <input type="text" id="threshold">
  <label class="field" for="engineKind">Engine</label>
  <select id="engineKind">
    <option value="lfm">LFM Iter 21-web (default — web ads, no content false-positives)</option>
    <option value="lfm-iter22">LFM Iter 22-web (experimental — higher web-ad recall)</option>
    <option value="lfm-web">LFM Iter 20-web (aggressive web-ad blocking)</option>
    <option value="lfm-stream">LFM Iter 14 (streaming-only)</option>
    <option value="siglip2">SigLIP2-384 (fast)</option>
    <option value="lite">Lite B/16 (WASM fallback — no-WebGPU, Iter 21-web, fp32)</option>
  </select>

  <div id="status"></div>
  <div id="bar"><div></div></div>

  <div class="foot">
    <span id="ver">Minus</span>
    <a id="repo" href="https://github.com/garagehq/Minus-chrome-extension" target="_blank" rel="noopener">source ↗</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>

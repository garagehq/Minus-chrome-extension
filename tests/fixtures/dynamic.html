<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Minus fixture — dynamic ad insert</title>
<style>body{font-family:sans-serif;max-width:1100px;margin:24px auto}img{width:480px;height:270px;object-fit:cover}</style>
</head>
<body>
  <h1>SPA-style page</h1>
  <p>An ad image is injected 4 seconds after load (like programmatic ad slots).</p>
  <div id="slot"></div>
  <script>
    setTimeout(() => {
      const img = document.createElement("img");
      img.id = "late-ad";
      img.src = "ad1.png";
      document.getElementById("slot").appendChild(img);
    }, 4000);
  </script>
</body>
</html>

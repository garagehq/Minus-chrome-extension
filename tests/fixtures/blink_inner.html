<!DOCTYPE html>
<html><head><style>
body{margin:0;overflow:hidden;background:#123}
#box{width:60vw;height:60vh;border-radius:8px;animation:sw 1.2s linear infinite alternate}
@keyframes sw{0%{background:#ff3355;transform:translate(0,0)}50%{background:#33ddff;transform:translate(30vw,10vh)}100%{background:#ffee33;transform:translate(5vw,30vh)}}
</style></head><body><div id="box"></div></body></html>
